<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase bill register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* bookledger tokens, lifted from src/index.css (theme "white"). Nothing new is
   invented here; the register changes information design, not paint. */
:root{
  --canvas:#F6F5F3; --surface:#FFFFFF;
  --ink-1:#111111; --ink-2:#444444; --ink-3:#68707C;
  --accent:#D97706; --accent-hover:#B45309; --accent-text:#AB4F08; --on-accent:#1A1206;
  --pos:#047857; --neg:#D01040;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.14); --rail:rgba(0,0,0,.16);
  --hover:rgba(17,17,17,.028); --selected:#FCF4E7; --selected-line:rgba(217,119,6,.35);
  --invert-bg:#161616; --invert-ink:#F5F5F0; --invert-3:#A3A3A3;
  --focus:#AB4F08;
  --shadow-pop:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.10);
  --r-sm:4px; --r-md:6px; --r-xl:8px;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* one column template for header, bands, bills, lines and totals */
  --cols: 36px 28px 168px minmax(170px,1.15fr) minmax(200px,1.5fr) 158px 128px 120px 128px 40px;
  --head-h:36px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0F0F0F; --surface:#1A1A1A;
    --ink-1:#F5F5F0; --ink-2:#C4C4C4; --ink-3:#949494;
    --accent:#F59E0B; --accent-hover:#D97706; --accent-text:#FBBF24; --on-accent:#1A1206;
    --pos:#34D399; --neg:#FB7185;
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14); --rail:rgba(255,255,255,.18);
    --hover:rgba(255,255,255,.03); --selected:#2A2114; --selected-line:rgba(245,158,11,.35);
    --invert-bg:#F5F5F0; --invert-ink:#111111; --invert-3:#5C5C5C;
    --focus:#FBBF24; --shadow-pop:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0F0F0F; --surface:#1A1A1A;
  --ink-1:#F5F5F0; --ink-2:#C4C4C4; --ink-3:#949494;
  --accent:#F59E0B; --accent-hover:#D97706; --accent-text:#FBBF24; --on-accent:#1A1206;
  --pos:#34D399; --neg:#FB7185;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14); --rail:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.03); --selected:#2A2114; --selected-line:rgba(245,158,11,.35);
  --invert-bg:#F5F5F0; --invert-ink:#111111; --invert-3:#5C5C5C;
  --focus:#FBBF24; --shadow-pop:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--surface);color:var(--ink-1);font:400 13px/1.45 var(--sans);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:500 11px var(--mono);color:var(--ink-3);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:0 4px;min-width:18px;text-align:center;display:inline-block;line-height:16px}

/* ── App bar ─────────────────────────────────────────────── */
.appbar{background:var(--canvas);border-bottom:1px solid var(--border)}
.appbar-in{max-width:1440px;margin:0 auto;height:48px;display:flex;align-items:center;gap:24px;padding:0 24px}
.brand{font-weight:800;font-size:15px;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--accent);display:block}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav a{color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:var(--r-md);white-space:nowrap;font-weight:500}
.nav a:hover{background:var(--hover);color:var(--ink-1)}
.nav a[aria-current]{color:var(--ink-1);font-weight:600;background:var(--surface);box-shadow:0 0 0 1px var(--border)}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.shop{color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r-md)}
.shop:hover{background:var(--hover)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--ink-1);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700}

/* ── Page ────────────────────────────────────────────────── */
.page{max-width:1440px;margin:0 auto;padding:20px 24px 0}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:700;letter-spacing:-0.025em;line-height:28px}
.ph .sub{color:var(--ink-3);font-size:13px;line-height:28px}
.ph .acts{margin-left:auto;display:flex;gap:8px}

.btn{height:32px;padding:0 12px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;transition:background-color 160ms var(--ease),transform 120ms var(--ease),box-shadow 160ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-quiet{color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--border-2);background:var(--surface)}
.btn-quiet:hover{background:var(--canvas)}
.btn .k{font:500 11px var(--mono);opacity:.6;margin-left:2px}

/* tabs */
.tabs{display:flex;gap:24px;margin-top:16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;padding:10px 0 11px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:var(--ink-3);font-weight:500}
.tab:hover{color:var(--ink-1)}
.tab .c{font:500 12px var(--mono);color:var(--ink-3)}
.tab .a{font:400 12px var(--mono);color:var(--ink-3)}
.tab .a.neg{color:var(--neg)}
.tab[aria-selected="true"]{color:var(--ink-1);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 0 0;flex-wrap:wrap}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:32px;border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--border-2);background:var(--surface);padding:0 34px 0 32px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{box-shadow:inset 0 0 0 1px var(--ink-3)}
.search input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.fbtn{height:32px;padding:0 10px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--border-2);white-space:nowrap;color:var(--ink-1);font-weight:500;transition:background-color 160ms var(--ease)}
.fbtn:hover{background:var(--canvas)}
.fbtn .lbl{color:var(--ink-3);font-weight:500}
.fbtn .rng{font-size:12.5px;color:var(--ink-2)}
.fbtn.on{box-shadow:inset 0 0 0 1px var(--ink-3)}
.fbtn svg.chev{color:var(--ink-3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;height:32px;padding:2px;border-radius:var(--r-md);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--border)}
.seg span{align-self:center;padding:0 8px 0 6px;color:var(--ink-3);font-weight:500}
.seg button{padding:0 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-1);font-weight:600;box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(16,24,40,.05)}

.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:10px}
.chip{height:26px;display:inline-flex;align-items:center;gap:4px;padding:0 4px 0 10px;border-radius:var(--r-md);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--border);font-weight:500;font-size:12px}
.chip b{font-weight:600}
.chip button{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--ink-3)}
.chip button:hover{background:var(--hover);color:var(--ink-1)}
.linkbtn{color:var(--accent-text);font-weight:600;padding:2px 4px;border-radius:var(--r-sm)}
.linkbtn:hover{text-decoration:underline}

/* summary sentence */
.summary{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:14px 0 12px;color:var(--ink-2)}
.summary .s{display:flex;flex-wrap:wrap;gap:4px 0}
.summary .s > span{white-space:nowrap}
.summary .s > span + span::before{content:"·";color:var(--ink-3);padding:0 8px}
.summary b{font-weight:600;color:var(--ink-1);font-family:var(--mono);font-size:12.5px;letter-spacing:-0.02em}
.summary b.neg{color:var(--neg)}
.summary .ctx{margin-left:auto;color:var(--ink-3);font-size:12px}

/* ── Register ────────────────────────────────────────────── */
.reg{position:relative;border-top:1px solid var(--border-2)}
.grid{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:0}
.grid > *{min-width:0;padding:0 8px}
.grid > .cb{padding:0 0 0 8px;display:flex;align-items:center}
.grid > .chev{padding:0;display:flex;justify-content:center}
.r{text-align:right}
.thead{position:sticky;top:0;z-index:4;height:var(--head-h);background:var(--canvas);border-bottom:1px solid var(--border-2);font-size:12px;font-weight:600;color:var(--ink-2)}
.thead .sortable{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink-2);padding:2px 0}
.thead .sortable:hover{color:var(--ink-1)}

input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--ink-1);cursor:pointer}

.band{position:sticky;top:var(--head-h);z-index:3;height:32px;background:var(--canvas);border-bottom:1px solid var(--border);font-size:12px}
.band .lbl{grid-column:1 / 7;padding-left:16px;display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden}
.band .lbl b{font-weight:700;color:var(--ink-1);font-size:12.5px}
.band .lbl span{color:var(--ink-3)}
.band .num{color:var(--ink-3);font-size:12px;font-weight:500}
.band .num.neg{color:var(--neg)}

.bill{border-bottom:1px solid var(--border)}
.row{min-height:44px;padding:4px 0;cursor:default;transition:background-color 160ms var(--ease);position:relative}
.row:hover{background:var(--hover)}
.row:focus{outline:none}
.row:focus-visible{box-shadow:inset 2px 0 0 var(--focus), inset 0 0 0 1px var(--focus)}
.bill.sel .row{background:var(--selected)}
.bill.sel .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.chevbtn{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);transition:transform 200ms var(--ease),background-color 160ms var(--ease)}
.chevbtn:hover{background:var(--hover);color:var(--ink-1)}
.bill.open .chevbtn{transform:rotate(90deg);color:var(--ink-1)}
.two{display:flex;flex-direction:column;gap:0;line-height:1.3}
.two .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.billno{font:500 12.5px var(--mono);letter-spacing:-0.02em;color:var(--ink-1)}
.billno.missing{font-family:var(--sans);color:var(--ink-3);font-weight:500;font-size:12.5px;letter-spacing:-0.01em}
.sup .t{font-weight:600}
.items .t{color:var(--ink-1)}
.items .more{color:var(--ink-3);font-weight:500}
.creep{font-weight:500;color:var(--ink-2)}

.st{display:flex;flex-direction:column;gap:0;line-height:1.3}
.st .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.st .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.st .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:12px}
.st.paid .t{color:var(--ink-3);font-weight:500}
.st.paid .t::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.st.due .t{color:var(--ink-1)}
.st.due .t::before{background:var(--ink-1)}
.st.part .t{color:var(--ink-1)}
.st.part .t::before{background:var(--accent)}
.st.over .t{color:var(--neg)}
.st.over .t::before{background:var(--neg)}
.st.today .t{font-weight:700}
.billno.pv{color:var(--ink-2)}
.band .lbl b.over{color:var(--neg)}
.band .lbl .ov,.tfoot .lbl .ov{color:var(--neg);font-weight:600}
.band .lbl .ov .num,.tfoot .lbl .ov .num{font-size:12px}
.thead .sortable[aria-sort] {color:var(--ink-1)}
.thead .r .sortable{flex-direction:row-reverse}
.thead .sortable svg{opacity:.45}
.thead .sortable[data-on] svg{opacity:1}
.loadmore{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.loadmore .btn{height:28px;font-size:12.5px}
.toast button{color:var(--accent);font-weight:700;margin-left:12px;padding:2px 4px;border-radius:var(--r-sm)}
.toast.show{pointer-events:auto}

.amt{font:500 13px var(--mono);letter-spacing:-0.02em;color:var(--ink-1)}
.amt.muted{color:var(--ink-3);font-weight:400}
.amt.neg{color:var(--neg);font-weight:600}
.amt.blank{color:transparent}

.morebtn{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3);transition:background-color 160ms var(--ease)}
.morebtn:hover,.morebtn[aria-expanded="true"]{background:var(--canvas);color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--border)}

/* expanded lines share the bill's grid; the rail sits in the chevron column */
.lines{display:none;padding:0 0 10px}
.bill.open .lines{display:block}
.line{min-height:40px;padding:4px 0;font-size:12.5px}
.line .rail{align-self:stretch;position:relative}
.line .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rail)}
.line .nm{grid-column:3 / 5;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.line .nm .t{color:var(--ink-1);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.line .nm .h{font:400 11.5px var(--mono);color:var(--ink-3)}
.line .qty{font:400 12px var(--mono);color:var(--ink-2);letter-spacing:-0.02em;white-space:nowrap}
.line .qty u{text-decoration:none;color:var(--ink-3)}
.delta{display:flex;flex-direction:column;line-height:1.3;white-space:nowrap}
.delta .p{font:600 12px var(--mono);letter-spacing:-0.02em}
.delta .v{font:400 11.5px var(--mono);color:var(--ink-3);letter-spacing:-0.02em}
.delta.up .p{color:var(--neg)}
.delta.dn .p{color:var(--pos)}
.delta.flat .p,.delta.first .p{color:var(--ink-3);font-weight:500;font-family:var(--sans);letter-spacing:-0.01em}
.line .amt{font-size:12.5px;font-weight:400}
.linkicon{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3)}
.linkicon:hover{background:var(--canvas);color:var(--ink-1)}
.bfoot{min-height:36px;font-size:12px;color:var(--ink-3);padding-top:4px}
.bfoot .rail{align-self:stretch;position:relative}
.bfoot .rail::before{content:"";position:absolute;left:50%;top:0;height:14px;width:2px;margin-left:-1px;background:var(--rail)}
.bfoot .meta{grid-column:3 / 7;display:flex;flex-wrap:wrap;gap:2px 0;align-items:baseline}
.bfoot .meta > span{white-space:nowrap}
.bfoot .meta > span + span::before{content:"·";padding:0 8px}
.bfoot .meta b{font:500 12px var(--mono);color:var(--ink-2);letter-spacing:-0.02em}
.bfoot .go{grid-column:7 / -1;display:flex;justify-content:flex-end;gap:4px;padding-right:8px}

/* totals + bulk, sticky to the bottom of the viewport */
.dock{position:sticky;bottom:0;z-index:5}
.bulk{display:none;background:var(--invert-bg);color:var(--invert-ink);min-height:48px;align-items:center;gap:6px;padding:0 8px 0 16px;border-radius:var(--r-xl) var(--r-xl) 0 0;flex-wrap:wrap}
.bulk.show{display:flex}
.bulk .cnt{font-weight:700}
.bulk .tot{font:600 13px var(--mono);letter-spacing:-0.02em}
.bulk .note{color:var(--invert-3);font-size:12px}
.bulk .sp{flex:1}
.bulk button{height:32px;padding:0 10px;border-radius:var(--r-md);color:var(--invert-ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.bulk button:hover{background:rgba(127,127,127,.18)}
.bulk button[disabled]{color:var(--invert-3);cursor:not-allowed}
.bulk button[disabled]:hover{background:none}
.bulk .primary{background:var(--accent);color:var(--on-accent)}
.bulk .primary:hover{background:var(--accent-hover)}
.bulk .primary[disabled]{background:transparent;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);color:var(--invert-3)}
.bulk .primary[disabled]:hover{background:transparent}
.bulk .div{width:1px;height:20px;background:rgba(127,127,127,.35);margin:0 4px}
.tfoot{min-height:44px;background:var(--canvas);border-top:1px solid var(--border-2);font-weight:600}
.tfoot .lbl{grid-column:1 / 7;padding-left:16px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.tfoot .lbl span{color:var(--ink-3);font-weight:500;font-size:12px}
.tfoot .num{font-weight:600;font-size:13px}
.tfoot .num.neg{color:var(--neg)}

.empty{padding:40px 16px 48px;color:var(--ink-2)}
.empty p + p{margin-top:4px;color:var(--ink-3)}

.foot-note{max-width:1440px;margin:0 auto;padding:16px 24px 40px;color:var(--ink-3);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
.foot-note span{display:inline-flex;gap:6px;align-items:center}

/* popovers */
.pop{position:absolute;z-index:50;min-width:220px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-pop),0 0 0 1px var(--border-2);padding:4px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity 180ms var(--ease),transform 180ms var(--ease);pointer-events:none}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop .hd{padding:8px 10px 6px;font-size:12px;color:var(--ink-3);font-weight:500}
.mi{width:100%;min-height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-md);text-align:left;color:var(--ink-1);white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--canvas);outline:none}
.mi svg{color:var(--ink-3)}
.mi .x{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12px}
.mi .x.num{font-size:11.5px}
.mi.danger{color:var(--neg)}
.mi.danger svg{color:var(--neg)}
.mi[aria-disabled="true"]{color:var(--ink-3);cursor:not-allowed}
.mi[aria-checked="true"]{font-weight:600}
.mi .tick{width:16px;display:grid;place-items:center;color:var(--ink-1)}
.sep{height:1px;background:var(--border);margin:4px 0}
.pop .inp{margin:4px 6px 6px;position:relative}
.pop .inp input{width:100%;height:30px;border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--border-2);background:var(--surface);padding:0 10px;outline:none}

const last = {}; for (const k in SEED) last[k] = {rate:SEED[k][0], date:d(SEED[k][1])};
const BILLS = RAW.map(r => {
  const [id,no,ds,sk,mode,ls,paidRaw,paidOn,paidBy,pv] = r;
  return {id,no,date:d(ds),sk,sup:SUP[sk],mode,paidRaw,paidOn:paidOn?d(paidOn):null,paidBy,pv,
    lines: ls.map(([k,q,rate]) => ({k,item:ITEM[k],q,rate,amt:q*rate}))};
}).sort((a,b)=>a.date-b.date);
for (const b of BILLS){
  for (const l of b.lines){ l.prev = last[l.k] || null; l.pct = l.prev ? (l.rate - l.prev.rate)/l.prev.rate*100 : null; }
  for (const l of b.lines) last[l.k] = {rate:l.rate, date:b.date};
  b.amount = sum(b.lines,'amt');
  b.paid = b.paidRaw==='full' ? b.amount : b.paidRaw;
  b.due = Math.max(0, b.amount - b.paid);
  b.credit = b.mode==='CREDIT' ? b.sup.credit : 0;
  b.dueOn = new Date(+b.date + b.credit*DAY);
  b.dleft = days(b.dueOn, TODAY);
  b.state = b.due < .005 ? 'paid' : b.dleft < 0 ? 'over' : b.paid > 0 ? 'part' : 'due';
  b.overAmt = b.state==='over' ? b.due : 0;
  b.dearer = b.lines.filter(l => l.pct !== null && l.pct >= HINT).length;
  b.cheaper = b.lines.filter(l => l.pct !== null && l.pct <= -HINT).length;

}

function baseSet(){
  const q = S.q.trim().toLowerCase();
  return BILLS.filter(b =>
    b.date >= S.range.from && b.date <= S.range.to &&
    (!S.sups.size || S.sups.has(b.sk)) &&
    (!S.terms.size || S.terms.has(b.mode)) &&
    (!q || (b.no||'').toLowerCase().includes(q) || b.pv.toLowerCase().includes(q) || b.sup.name.toLowerCase().includes(q) || b.lines.some(l=>l.item.name.toLowerCase().includes(q))));
}
const shown = () => baseSet().filter(TABS.find(t=>t.id===S.tab).test).sort(SORTS[view().sort].fn);

/* ── Selection is scoped to what is on screen ─────────────────────────── */
// Changing tab or filters clears it (with Undo that restores view + selection).
function changeView(mut){
  const had = S.sel.size;
  const snap = had ? {tab:S.tab, q:S.q, range:S.range, sups:new Set(S.sups), terms:new Set(S.terms), sel:new Set(S.sel)} : null;
  mut();
  if (had){
    const still = new Set(shown().map(b=>b.id));
    if ([...S.sel].some(id=>!still.has(id))){
      S.sel.clear();
      toast(`Selection of ${had} bill${had>1?'s':''} cleared · ${/Mac/.test(navigator.platform)?'⌘':'Ctrl+'}Z`, 'Undo', () => { Object.assign(S, {tab:snap.tab,q:snap.q,range:snap.range,sups:snap.sups,terms:snap.terms,sel:snap.sel}); $('#q').value=S.q; render(); });
    }
  }
  render();
}

function statusCell(b){
  const mode = b.mode==='CREDIT' ? `Credit ${b.credit}d` : TERMS[b.mode];
  let cls, t, m;
  if (b.state==='paid'){ cls='paid'; t='Paid'; m = b.mode==='CREDIT' ? `Credit · settled ${fDate(b.paidOn,false)}` : `${mode} · ${fDate(b.paidOn,false)}`; }
  else if (b.state==='over'){ cls='over'; t=`Overdue ${-b.dleft}d`; m = b.paid>0 ? `Part paid · due ${fDate(b.dueOn,false)}` : `Was due ${fDate(b.dueOn,false)}`; }
  else if (b.state==='part'){ cls='part'; t='Part paid'; m = `Due in ${b.dleft}d · ${fDate(b.dueOn,false)}`; }
  else if (b.dleft===0){ cls='due today'; t='Due today'; m = `${fDate(b.dueOn,false)} · ${mode}`; }
  else { cls='due'; t = `Due in ${b.dleft}d`; m = `${fDate(b.dueOn,false)} · ${mode}`; }
  const tip = b.mode==='CREDIT' ? `${b.credit} days credit · due ${fDate(b.dueOn)}` : `${TERMS[b.mode]} purchase`;
  const dueamt = b.due>0 && b.paid>0 ? `<span class="dueamt">${money(b.due)} left</span>` : '';
  return `<div class="st ${cls}" title="${tip}"><span class="t">${t}${dueamt}</span><span class="m">${m}</span></div>`;
}

function deltaCell(l){
  if (!l.prev) return `<div class="delta first"><span class="p">First purchase</span><span class="v">no earlier rate</span></div>`;
  const p = l.pct, when = fDate(l.prev.date,false);
  if (Math.abs(p) < 0.5) return `<div class="delta flat"><span class="p">No change</span><span class="v">vs ₹${money(l.prev.rate)} · ${when}</span></div>`;
  const up = p > 0;
  return `<div class="delta ${up?'up':'dn'}" aria-label="${up?'Costlier':'Cheaper'} by ${Math.abs(p).toFixed(1)} percent than ₹${money(l.prev.rate)} on ${when}"><span class="p">${up?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span><span class="v">vs ₹${money(l.prev.rate)} · ${when}</span></div>`;
}

// Due totals stay in ink; only the overdue part is red, as its own figure.
function bandHTML(label, sub, list, opts={}){
  const n = list.length, amt = sum(list,'amount'), paid = sum(list,'paid'), due = sum(list,'due'), over = sum(list,'overAmt');
  const ov = over && !opts.allOver ? `<span class="ov">· <span class="num">${rupee(over)}</span> overdue</span>` : '';
  const lbl = `<div class="lbl"><b${opts.allOver?' class="over"':''}>${label}</b><span>${sub}</span>${ov}</div>`;
  if (n===1 && !opts.always) return `<div class="band grid" role="row">${lbl}</div>`;
  return `<div class="band grid" role="row">${lbl}
    <div class="num r c-amt">${rupee(amt)}</div><div class="num r c-paid">${paid?rupee(paid):''}</div>
    <div class="num r c-due">${due?rupee(due)+'<span class="w"> due</span>':''}</div><div class="c-x"></div></div>`;
}
const bills = n => `${n} bill${n>1?'s':''}`;
const monday = t => new Date(+t - ((t.getUTCDay()+6)%7)*DAY);

function groupsFor(list){
  const g = view().group, sort = view().sort;
  const bucket = (keyFn) => { const m = new Map(); for (const b of list){ const k = keyFn(b); if(!m.has(k)) m.set(k,[]); m.get(k).push(b); } return [...m.entries()]; };
  // Rows keep the chosen sort inside a band; bands have their own fixed order.
  const dateOrder = sort==='old' ? 1 : -1;
  if (g==='status'){
    const wk = +TODAY + 7*DAY;
    const defs = [
      ['over','Overdue', b=>b.state==='over', l=>`${bills(l.length)} · oldest ${-Math.min(...l.map(b=>b.dleft))}d past due`, {allOver:true, always:true}],
      ['wk','Due in 7 days', b=>b.due>0 && b.dleft>=0 && +b.dueOn<=wk, l=>`${bills(l.length)} · by ${fDate(new Date(wk),false)}`, {always:true}],
      ['later','Due later', b=>b.due>0 && +b.dueOn>wk, l=>`${bills(l.length)} · after ${fDate(new Date(wk),false)}`, {always:true}],
      ['paid','Paid', b=>b.due===0, l=>bills(l.length), {always:true}],
    ];
    return defs.map(([k,label,test,sub,o]) => { const l = list.filter(test); return l.length ? {label, sub:sub(l), list:l, opts:o} : null; }).filter(Boolean);
  }
  if (g==='day') return bucket(b=>+b.date).sort((a,b)=>dateOrder*(a[0]-b[0])).map(([k,l])=>{ const t=new Date(k), r=days(TODAY,t); return {label:fDate(t), sub:`${r===0?'Today':r===1?'Yesterday':WK[t.getUTCDay()]} · ${bills(l.length)}`, list:l}; });
  if (g==='week') return bucket(b=>+monday(b.date)).sort((a,b)=>dateOrder*(a[0]-b[0])).map(([k,l])=>{ const s=new Date(k), e=new Date(k+6*DAY), w=days(monday(TODAY),s)/7; return {label:`${s.getUTCMonth()===e.getUTCMonth()?s.getUTCDate():fDate(s,false)} – ${fDate(e)}`, sub:`${w===0?'This week':w===1?'Last week':w+' weeks ago'} · ${bills(l.length)}`, list:l}; });
  if (g==='month') return bucket(b=>b.date.getUTCFullYear()*12+b.date.getUTCMonth()).sort((a,b)=>dateOrder*(a[0]-b[0])).map(([k,l])=>({label:`${MONL[k%12]} ${Math.floor(k/12)}`, sub:`${bills(l.length)} by bill date`, list:l, opts:{always:true}}));
  if (g==='supplier') return bucket(b=>b.sk).sort((a,b)=>sum(b[1],'due')-sum(a[1],'due') || SUP[a[0]].name.localeCompare(SUP[b[0]].name)).map(([k,l])=>{ const s=SUP[k]; return {label:esc(s.name), sub:`${esc(s.place)} · <span class="num" style="font-size:11.5px">${s.gstin}</span> · ${bills(l.length)} · ${s.credit?s.credit+' days credit':'Cash supplier'}`, list:l}; });
  return [{list, none:true}];
}

function render(){
  const base = baseSet();
  $('#tabs').innerHTML = TABS.map(t=>{
    const l = base.filter(t.test), due = sum(l,'due');
    const a = t.money && l.length ? `<span class="a${t.neg?' neg':''}">${rupee(due)}</span>` : '';
    const on = S.tab===t.id;
    return `<button class="tab" role="tab" type="button" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${on}" aria-controls="reg" tabindex="${on?0:-1}">${t.label}<span class="c">${l.length}</span>${a}</button>`;
  }).join('');

  const v = view(), list = shown();
  const tAmt=sum(list,'amount'), tPaid=sum(list,'paid'), tDue=sum(list,'due'), tOver=sum(list,'overAmt');
  const sups = new Set(list.map(b=>b.sk)).size;
  const overTxt = tOver && Math.abs(tOver-tDue)>.005 ? `, of which <b class="neg">${rupee(tOver)}</b> overdue` : tOver ? `, <b class="neg" style="font-family:var(--sans);font-size:13px">all overdue</b>` : '';
  const isOpen = OPEN_TABS.includes(S.tab);
  $('#summary').innerHTML = list.length ? `<div class="s">
      <span><b>${list.length}</b> bills from ${sups} supplier${sups>1?'s':''}</span>
      <span><b>${rupee(tAmt)}</b> billed</span>
      <span><b>${rupee(tPaid)}</b> paid</span>
      ${S.tab==='paid' ? '' : `<span><b>${rupee(tDue)}</b> due${overTxt}</span>`}</div>
      <span class="ctx">${S.range.label} · ${fDate(S.range.from)} – ${fDate(S.range.to)}</span>
      <div class="msum">${S.tab==='paid' ? `<b>${rupee(tPaid)}</b> paid · ${bills(list.length)}` : `<b>${rupee(tDue)}</b> due${tOver?` · <b class="neg">${rupee(tOver)}</b> overdue`:''} · ${bills(list.length)}`}</div>` : '';

  let html = '';
  if (!list.length){
    const t = TABS.find(t=>t.id===S.tab);
    html = S.tab==='over' && !S.q && !S.sups.size && !S.terms.size
      ? `<div class="empty"><p>Nothing overdue in ${S.range.label.toLowerCase()}.</p><p>${rupee(sum(base,'due'))} is due, all within its credit days.</p></div>`
      : `<div class="empty"><p>No ${t.id==='all'?'':t.label.toLowerCase()+' '}bills match${S.q?` “${esc(S.q)}”`:''} in ${S.range.label.toLowerCase()}.</p><p><button class="linkbtn" type="button" data-act="clear">Clear filters</button></p></div>`;
  } else {

function renderBulk(){
  const vis = new Set(shown().map(b=>b.id));
  for (const id of [...S.sel]) if (!vis.has(id)) S.sel.delete(id);   // never act on hidden rows
  const sel = BILLS.filter(b=>S.sel.has(b.id));
  const el = $('#bulk');
  if (!sel.length){ el.classList.remove('show'); el.innerHTML=''; return; }
  const amt = sum(sel,'amount'), due = sum(sel,'due');
  const sups = new Set(sel.map(b=>b.sk));
  const onePay = sups.size===1 && due>0;
  const nDue = sel.filter(b=>b.due>0).length;
  const why = sups.size>1 ? `${sups.size} suppliers selected — a payment settles one supplier` : due===0 ? 'Nothing due on these bills' : `Settles ${bills(nDue)} of ${SUP[[...sups][0]].name}`;
  const figs = Math.abs(amt-due)<.005 ? `<span class="tot">${rupee(due)}</span><span class="note">due</span>` : `<span class="tot">${rupee(amt)}</span>${due>0?`<span class="note">· ${rupee(due)} due</span>`:''}`;
  el.innerHTML = `<span class="cnt">${sel.length} selected</span><span class="note">·</span>${figs}<span class="div"></span><span class="note">${why}</span><span class="sp"></span>
    <button type="button" class="primary" data-act="bulkpay" ${onePay?'':'disabled'} title="${esc(why)}">${icon('pay')}Record payment</button>
    <button type="button" class="hide-sm" data-act="bulkprint">${icon('print')}Print vouchers</button>
    <button type="button" data-act="bulkexport">${icon('dl')}Export</button>
    <button type="button" data-act="unselect" aria-label="Clear selection">${icon('x')}</button>`;
  el.classList.add('show');
}

/* ── Popover menus ────────────────────────────────────────────────────── */
const pop = $('#pop'); let popAnchor = null, popHandler = null;
function openPop(anchor, html, handler, align='right'){
  closePop();
  pop.innerHTML = html; popAnchor = anchor; popHandler = handler;
  anchor.setAttribute('aria-expanded','true');
  const r = anchor.getBoundingClientRect();
  pop.style.minWidth = '';
  pop.classList.add('open');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = align==='right' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, document.documentElement.clientWidth - w - 8));
  let top = r.bottom + 4 + scrollY;
  if (r.bottom + h + 8 > innerHeight && r.top - h - 4 > 0) { top = r.top - h - 4 + scrollY; pop.style.transformOrigin = 'bottom right'; } else pop.style.transformOrigin = align==='right'?'top right':'top left';
  pop.style.left = left + scrollX + 'px'; pop.style.top = top + 'px';
  const f = pop.querySelector('input,[role=menuitem]:not([aria-disabled=true]),[role=menuitemradio],[role=menuitemcheckbox]'); f && f.focus({preventScroll:true});
}
function closePop(refocus){
  if (!popAnchor) return;
  popAnchor.setAttribute('aria-expanded','false');
  const a = popAnchor; popAnchor = null; popHandler = null;
  pop.classList.remove('open');
  if (refocus && document.contains(a)) a.focus({preventScroll:true});
}
pop.addEventListener('click', e => { const t = e.target.closest('[data-v]'); if (t && popHandler && t.getAttribute('aria-disabled')!=='true') popHandler(t.dataset.v, t, e); });
pop.addEventListener('keydown', e => {
  const items = [...pop.querySelectorAll('.mi:not([aria-disabled=true])')];
  const i = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){ e.preventDefault(); (items[i+1]||items[0]).focus(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); (items[i-1]||items[items.length-1]).focus(); }
  else if (e.key==='Escape'){ closePop(true); }
  else if (document.activeElement.tagName!=='INPUT' && e.key.length===1){
    const hit = pop.querySelector(`[data-key="${e.key.toUpperCase()}"]:not([aria-disabled=true])`);
    if (hit){ e.preventDefault(); hit.click(); }
  }
});

let tt, undoFn = null; function toast(m, actLabel, act){
  undoFn = act || null; if (act) setTimeout(()=>{ if (undoFn===act) undoFn=null; }, 5000);
  const t=$('#toast'); t.innerHTML = esc(m) + (actLabel ? `<button type="button">${actLabel}</button>` : '');
  if (act) t.querySelector('button').onclick = () => { t.classList.remove('show'); act(); };
  t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), act?5000:2400);
}
function toggleOpen(id){ S.open.has(id)?S.open.delete(id):S.open.add(id); const el=document.querySelector(`.bill[data-id="${id}"]`); if(el){ el.classList.toggle('open', S.open.has(id)); el.querySelector('.row').setAttribute('aria-expanded', S.open.has(id)); } }
function toggleSel(id, on){ (on ?? !S.sel.has(id)) ? S.sel.add(id) : S.sel.delete(id); render(); }
function setTab(id, focus){ changeView(()=>{ S.tab = id; try{localStorage.setItem('reg.tab',S.tab)}catch(e){} }); if (focus) document.querySelector(`[data-tab="${S.tab}"]`).focus(); }

document.addEventListener('click', e => {
  const t = e.target;
  if (popAnchor && !pop.contains(t) && !popAnchor.contains(t)) closePop();
  const tab = t.closest('[data-tab]'); if (tab){ setTab(tab.dataset.tab, true); return; }
  const hs = t.closest('[data-hsort]'); if (hs){ const k=hs.dataset.hsort, cur=view().sort;
    setView('sort', k==='date' ? (cur==='new'?'old':'new') : k==='amt' ? (cur==='amt'?'amtasc':'amt') : (cur==='due'?'dueasc':'due')); return; }
  const un = t.closest('[data-unchip]'); if (un){ const [k,v]=un.dataset.unchip.split(':'); changeView(()=>{ if(k==='q'){S.q='';$('#q').value='';} if(k==='sup')S.sups.delete(v); if(k==='term')S.terms.delete(v); }); return; }
  const tg = t.closest('[data-toggle]'); if (tg){ toggleOpen(tg.dataset.toggle); return; }
  const mo = t.closest('[data-more]'); if (mo){ if (popAnchor===mo) return closePop(); rowMenu(BILLS.find(b=>b.id===mo.dataset.more), mo); return; }
  if (t.matches('[data-sel]')) { toggleSel(t.dataset.sel, t.checked); return; }
  if (t.id==='selAll'){ const ids = shown().map(b=>b.id); ids.forEach(id => t.checked ? S.sel.add(id) : S.sel.delete(id)); render(); return; }
  const a = t.closest('[data-act]');
  if (a && !pop.contains(a)){
    const act = a.dataset.act;
    if (popAnchor===a) return closePop();
    if (act==='date') return dateMenu(a);
    if (act==='supplier') return supMenu(a);
    if (act==='mode') return termsMenu(a);
    if (act==='export') return exportMenu(a);
    if (act==='sort') return radioMenu(a, `Sort bills · ${tabName()} tab`, SORTS, view().sort, v=>setView('sort',v), 'Rows sort inside each group');
    if (act==='view') return viewMenu(a);
    if (act==='group') return radioMenu(a, `Group bills · ${tabName()} tab`, GROUPS, view().group, v=>setView('group',v), 'Remembered for this tab');
    if (act==='clear'){ changeView(()=>{ S.q=''; $('#q').value=''; S.sups.clear(); S.terms.clear(); S.range=PRESETS.find(p=>p.id==='fy'); }); return; }
    if (act==='unselect'){ S.sel.clear(); render(); return; }
    const b = BILLS.find(x=>x.id===a.dataset.id);
    const sel = BILLS.filter(x=>S.sel.has(x.id));
    if (b && (act==='pay'||act==='voucher')) return runAction(act, b);
    const msg = {new:'New purchase form opens', history:'Price history for '+(ITEM[a.dataset.item]||{}).name, loadmore:'Loads August 2026 rows; totals already include them',
      bulkpay:`One payment of ${rupee(sum(sel,'due'))} split across ${bills(sel.length)}`, bulkprint:`Printing ${sel.length} vouchers`, bulkexport:`Export of ${bills(sel.length)} selected`}[act];
    if (msg) toast(msg);
    return;
  }
  const row = t.closest('.row'); if (row && !t.closest('button,input,a')) toggleOpen(row.closest('.bill').dataset.id);
});

$('#q').value = S.q;
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); const v = e.target.value; qT = setTimeout(()=>changeView(()=>S.q=v), 120); });

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const typing = /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type!=='checkbox';
  if (e.key==='Escape' && popAnchor) return closePop(true);
  if ((e.metaKey||e.ctrlKey) && (e.key==='z'||e.key==='Z') && undoFn){ e.preventDefault(); const f=undoFn; undoFn=null; $('#toast').classList.remove('show'); f(); return; }
  if (pop.contains(ae)) return;
  if (typing){ if (e.key==='Escape') ae.blur(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  // tablist: arrows move between tabs
  if (ae.matches && ae.matches('[role=tab]') && (e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){
    e.preventDefault(); const i = TABS.findIndex(t=>t.id===S.tab);
    const n = e.key==='Home'?0 : e.key==='End'?TABS.length-1 : (i + (e.key==='ArrowRight'?1:-1) + TABS.length) % TABS.length;
    setTab(TABS[n].id, true); return;
  }
  if (e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  const row = ae.closest && ae.closest('.row');
  if (e.key==='n'||e.key==='N'){ toast('New purchase form opens'); return; }
  const rows = [...document.querySelectorAll('.row')];
  if (e.key==='j'||e.key==='k'||((e.key==='ArrowDown'||e.key==='ArrowUp') && (row || ae===document.body))){
    e.preventDefault(); const i = rows.indexOf(row), dn = e.key==='j'||e.key==='ArrowDown';
    const nx = rows[row ? Math.max(0,Math.min(rows.length-1, i+(dn?1:-1))) : 0]; nx && nx.focus(); nx && nx.scrollIntoView({block:'nearest'}); return;
  }
  if (!row) return;
  const id = row.closest('.bill').dataset.id, b = BILLS.find(x=>x.id===id);
  const k = e.key.toUpperCase();
  if (e.key==='ArrowRight' && !S.open.has(id)) toggleOpen(id);
  else if (e.key==='ArrowLeft' && S.open.has(id)) toggleOpen(id);
  else if (e.key==='Enter' && ae===row) toggleOpen(id);
  else if ((k==='X' || e.key===' ') && (ae===row || k==='X')){ e.preventDefault(); toggleSel(id); document.querySelector(`.bill[data-id="${id}"] .row`).focus(); }
  else if (e.key==='.'){ e.preventDefault(); rowMenu(b, row.querySelector('.morebtn')); }
  else if (e.key==='Backspace' || e.key==='Delete'){ e.preventDefault(); runAction('delete', b); }
  else { const a = ROW_ACTIONS.find(x=>x.key===k); if (a){ e.preventDefault(); runAction(a.v, b); } }
});

if (qs.get('static')) document.body.classList.add('static');
function isDark(){ return root.dataset.theme ? root.dataset.theme==='dark' : sysDark.matches; }
function syncTheme(){ const dk=isDark(); $('#themeLbl').textContent = dk?'Light':'Dark'; $('#themeBtn use').setAttribute('href', dk?'#i-sun':'#i-moon'); }
$('#themeBtn').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; syncTheme(); });
sysDark.addEventListener('change', syncTheme); syncTheme();

render();
if (qs.get('menu')){ const id = qs.get('menu'); const m = document.querySelector(`[data-more="${id}"]`); if (m) { m.scrollIntoView({block:'center'}); rowMenu(BILLS.find(b=>b.id===id), m); } }
})();
</script>
</body>
</html>
