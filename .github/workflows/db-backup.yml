# Nightly prod database backup → Cloudflare R2.
#
# Closes the gap that Supabase Free has no automated backups. Dumps the
# prod Postgres with pg_dump, gzips it, and uploads to an R2 bucket
# (S3-compatible) with a dated key. Keeps the cost at zero (R2 free tier
# is 10 GB) while we stay on the free Supabase plan.
#
# Required repo secrets:
#   SUPABASE_DB_URL        postgres connection string for prod, e.g.
#                          postgresql://postgres:<pwd>@db.lmviftlynuhopzmvaxeu.supabase.co:5432/postgres
#                          (Supabase dashboard → Project Settings → Database → Connection string → URI)
#   R2_ACCOUNT_ID          Cloudflare account id
#   R2_ACCESS_KEY_ID       R2 API token access key
#   R2_SECRET_ACCESS_KEY   R2 API token secret
#   R2_BUCKET              target bucket name (e.g. stockmate-backups)
#
# Restore: download the .sql.gz, `gunzip`, then `psql "<conn>" -f dump.sql`.
#
# THIS RAN AND FAILED EVERY NIGHT FOR WEEKS. The secrets below were never added,
# so pg_dump received an empty connection string, fell back to a local socket and
# died in 19 seconds. A red cross on a scheduled job is easy not to look at, and
# the result was the appearance of a backup with no file behind it -- worse than
# no backup at all, because it stops you worrying.
#
# So this workflow now: refuses to start with a clear message naming any missing
# secret, checks the dump actually contains data rather than just headers, and
# confirms the uploaded object exists in R2 before reporting success.

name: Nightly · DB backup to R2

on:
  schedule:
    # 20:30 UTC = 02:00 IST — well after close, low traffic.
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres 17 client
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump + upload to R2
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          # Fail with a sentence a human can act on, not a socket error.
          missing=""
          [ -z "${SUPABASE_DB_URL:-}"      ] && missing="$missing SUPABASE_DB_URL"
          [ -z "${R2_ACCOUNT_ID:-}"        ] && missing="$missing R2_ACCOUNT_ID"
          [ -z "${AWS_ACCESS_KEY_ID:-}"    ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${R2_BUCKET:-}"            ] && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::No backup was taken. These repo secrets are empty or unset:$missing"
            echo "::error::Add them at Settings → Secrets and variables → Actions."
            exit 1
          fi

          stamp=$(date -u +%Y-%m-%d_%H%M)
          file="ledgrpro-prod-${stamp}.sql.gz"

          echo "Dumping prod database…"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges | gzip > "$file"

          # A dump that connected but returned nothing still gzips to a valid
          # file. Check it holds real schema before calling it a backup.
          size=$(stat -c%s "$file")
          echo "Dump size: $size bytes"
          if [ "$size" -lt 20000 ]; then
            echo "::error::Dump is only ${size} bytes — too small to be a real backup. Not uploading."
            exit 1
          fi
          if ! gunzip -c "$file" | grep -q 'CREATE TABLE public.sales'; then
            echo "::error::Dump does not contain the sales table. Refusing to upload a partial backup."
            exit 1
          fi

          echo "Uploading to R2…"
          aws s3 cp "$file" "s3://${R2_BUCKET}/daily/${file}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Confirm it is actually there. An upload that silently no-ops would
          # otherwise report success, which is the fault this job already had.
          if ! aws s3 ls "s3://${R2_BUCKET}/daily/${file}" \
                 --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | grep -q "$file"; then
            echo "::error::Upload reported success but the object is not in the bucket."
            exit 1
          fi
          echo "✓ Backup verified in R2: daily/${file} (${size} bytes)"
