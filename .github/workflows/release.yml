name: Release Desktop + Mobile App

# Push a version tag (e.g. v1.0.0) to build + publish installers + APK.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate that nothing was running. `prebuild` only fires before
      # `npm run build`; electron:publish is `vite build && electron-builder`,
      # so npm never invoked it and every release so far shipped without the
      # crash lint or a single test. It was enforced only by whoever happened to
      # run a local build first — which is not enforcement.
      - name: Crash lint and unit tests
        run: npm run lint:crash && npm run test:unit

      - name: Build and publish
        env:
          # GitHub token — auto-provided, used by electron-builder to upload
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code signing (no certs configured)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Vite build-time env (set these as repository secrets)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BOOTSTRAP_ADMIN_EMAILS: ${{ secrets.VITE_BOOTSTRAP_ADMIN_EMAILS }}
          VITE_ENV: production
        run: npm run electron:publish

  # The android job lived here and built an APK on every desktop tag. Nothing
  # installed it: the in-app updater (mobile_app/lib/core/update/auto_updater.dart)
  # lists releases and matches `mobile-v*` only, taking the version FROM the tag.
  # An APK attached to a `v1.6.16` release is therefore invisible to it -- and
  # pointing the updater at `v*` would compare tag 1.6.16 against an installed
  # 1.7.8 and read it as a downgrade, because desktop and mobile version
  # independently.
  #
  # So it was several minutes of build per release producing 93 MB nobody could
  # reach. Mobile ships through `mobile-v*`, cut separately -- see
  # feedback-mobile-release-flow.