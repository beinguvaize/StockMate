name: Release Desktop + Mobile App

# Push a version tag (e.g. v1.0.0) to build + publish installers + APK.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate that nothing was running. `prebuild` only fires before
      # `npm run build`; electron:publish is `vite build && electron-builder`,
      # so npm never invoked it and every release so far shipped without the
      # crash lint or a single test. It was enforced only by whoever happened to
      # run a local build first — which is not enforcement.
      - name: Crash lint and unit tests
        run: npm run lint:crash && npm run test:unit

      - name: Build and publish
        env:
          # GitHub token — auto-provided, used by electron-builder to upload
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code signing (no certs configured)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Vite build-time env (set these as repository secrets)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BOOTSTRAP_ADMIN_EMAILS: ${{ secrets.VITE_BOOTSTRAP_ADMIN_EMAILS }}
          VITE_ENV: production
        run: npm run electron:publish

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the version used locally — newer Flutter (3.44+) made
          # IconData a `final` class which breaks lucide_icons 0.257.0.
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Pub get
        working-directory: mobile_app
        run: flutter pub get

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile_app/android/upload-keystore.jks
          cat > mobile_app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Same gap on the mobile side: it went straight to an APK with nothing
      # run against it. `flutter analyze` catches the async-gap and null-safety
      # classes of mistake that only show at runtime on a phone.
      - name: Analyze and test
        working-directory: mobile_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Rename APK with version tag
        working-directory: mobile_app
        run: |
          TAG="${GITHUB_REF_NAME}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/StockMate-${TAG}.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile_app/build/app/outputs/flutter-apk/StockMate-*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
