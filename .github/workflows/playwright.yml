name: Playwright Tests
# Scoped to this branch and manual runs. main is the application branch: these
# tests need a dev server and credentials, so running them there would fail on
# every app push.
on:
  push:
    branches: [ qa-tests ]
  pull_request:
    branches: [ qa-tests ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Credentials come from repository secrets, never from the source. Add
      # E2E_EMAIL and E2E_PASSWORD under Settings -> Secrets and variables.
      env:
        E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
