# Nightly safety-net for clients.outstanding_balance.
#
# Calls audit_outstanding_drift() on prod. The RPC logs any drift > ₹1
# to audit_log so the owner sees it in their Audit Log tab the next day,
# and any rows returned cause the workflow to fail loudly so we get
# email/Slack notifications from GitHub.
#
# Required repo secrets:
#   SUPABASE_URL                   https://lmviftlynuhopzmvaxeu.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY      service_role JWT (Settings → API)

name: Nightly · Outstanding-balance drift audit

on:
  schedule:
    # 02:30 UTC = 08:00 IST. After most kirana close, before next-day open.
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Call audit_outstanding_drift on prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/audit_outstanding_drift" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_threshold": 1.0}')
          echo "Response: $resp"
          count=$(echo "$resp" | jq 'length')
          echo "Drift rows: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count client(s) have outstanding-balance drift > ₹1. See audit_log."
            echo "$resp" | jq
            exit 1
          fi
          echo "✓ All client outstanding balances reconcile."
