# Nightly generation of due recurring expenses and invoices.
#
# Calls the generate_due_recurring_* RPCs on prod. Both are idempotent within a
# month, so re-runs are safe.
#
# The response is validated before it is counted. This job printed "Generated 2
# recurring invoice(s)" on a night it generated none: the service_role key had
# stopped authenticating, and `jq length` over the resulting error object
# counted its two KEYS. Claiming work that did not happen is the worst failure
# mode a scheduled job has -- nobody goes looking for invoices that the log says
# were already sent.
#
# Required repo secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: Nightly · Generate recurring expenses + invoices

on:
  schedule:
    # 01:00 UTC = 06:30 IST -- before shops open, after midnight rollover.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate due recurring expenses (prod)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          . scripts/lib/supabase_rpc.sh
          resp=$(rpc_array "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" \
                   generate_due_recurring_expenses) || exit 2
          echo "Generated $(printf '%s' "$resp" | jq 'length') recurring expense(s)."
          printf '%s' "$resp" | jq

      - name: Generate due recurring invoices (prod)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          . scripts/lib/supabase_rpc.sh
          resp=$(rpc_array "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" \
                   generate_due_recurring_invoices) || exit 2
          echo "Generated $(printf '%s' "$resp" | jq 'length') recurring invoice(s)."
          printf '%s' "$resp" | jq '[.[] | {invoice_number, client_name, grand_total}]'
