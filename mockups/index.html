<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Floor plan designer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Manrope,sans-serif;background:#F6F5F2;color:#1A1815}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  .track{letter-spacing:.1em}
  #floor{background:
     linear-gradient(#0000 0 0) padding-box,
     repeating-linear-gradient(0deg,#ece9e2 0 1px,transparent 1px 28px),
     repeating-linear-gradient(90deg,#ece9e2 0 1px,transparent 1px 28px),
     #fbfaf7;
     border-radius:18px;border:1px solid #e9e6df;position:relative;overflow:hidden}
  .tbl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
     border:2px solid;user-select:none;transition:box-shadow .15s}
  .tbl.sq{border-radius:14px}
  .tbl.rd{border-radius:999px}
  .designing .tbl{cursor:grab}
  .designing .tbl:active{cursor:grabbing;box-shadow:0 8px 24px -6px rgba(0,0,0,.25)}
</style>
</head>
<body class="p-8">
<div class="max-w-5xl mx-auto">

  <div class="flex items-end justify-between mb-4">
    <div>
      <h1 class="text-2xl font-extrabold">Floor plan designer <span class="text-stone-400 text-sm font-semibold">— sample</span></h1>
      <p class="text-[13px] text-stone-500">Drag tables to match your real layout. Toggle Service to see live status.</p>
    </div>
    <div class="flex items-center gap-2">
      <div class="inline-flex p-1 bg-stone-200/60 rounded-xl">
        <button id="mDesign" class="px-4 py-1.5 rounded-lg text-[12px] font-bold bg-white shadow-sm">Design</button>
        <button id="mService" class="px-4 py-1.5 rounded-lg text-[12px] font-bold text-stone-500">Service</button>
      </div>
    </div>
  </div>

  <!-- design toolbar -->
  <div id="toolbar" class="flex items-center gap-2 mb-3">
    <span class="text-[11px] font-bold uppercase track text-stone-400">Area</span>
    <select id="area" class="h-9 px-3 rounded-lg bg-white border border-stone-200 text-[13px] font-semibold outline-none">
      <option>AC Hall</option><option>Patio</option><option>Rooftop</option>
    </select>
    <span class="w-px h-6 bg-stone-200 mx-1"></span>
    <button data-add="sq" class="h-9 px-3 rounded-lg bg-white border border-stone-200 text-[12px] font-bold hover:border-amber-400 flex items-center gap-1.5">▢ Add square</button>
    <button data-add="rd" class="h-9 px-3 rounded-lg bg-white border border-stone-200 text-[12px] font-bold hover:border-amber-400 flex items-center gap-1.5">◯ Add round</button>
    <span class="text-[11px] text-stone-400 ml-1">click a table to resize / set seats · drag to move</span>
  </div>

  <div id="floor" style="height:440px"></div>

  <!-- legend -->
  <div class="flex items-center gap-5 mt-3 text-[12px] text-stone-500">
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm border-2 border-emerald-500 bg-emerald-50"></span>Free</span>
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm border-2 border-amber-500 bg-amber-50"></span>Occupied</span>
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm border-2 border-stone-400 bg-stone-100"></span>Other area</span>
    <span class="ml-auto mono text-[11px] text-stone-400">positions saved per table (pos_x, pos_y, shape, size)</span>
  </div>
</div>

<script>
const floor = document.getElementById('floor');
let designing = true;
// seed tables: {id,label,seats,x,y,w,h,shape,area,occupied}
let tables = [
  {id:1,label:'T1',seats:4,x:40,y:40,w:84,h:84,shape:'sq',area:'AC Hall',occupied:false},
  {id:2,label:'T2',seats:4,x:160,y:40,w:84,h:84,shape:'sq',area:'AC Hall',occupied:true},
  {id:3,label:'T3',seats:2,x:280,y:48,w:68,h:68,shape:'rd',area:'AC Hall',occupied:false},
  {id:4,label:'T4',seats:6,x:60,y:170,w:150,h:84,shape:'sq',area:'AC Hall',occupied:true},
  {id:5,label:'B1',seats:2,x:300,y:180,w:64,h:64,shape:'rd',area:'AC Hall',occupied:false},
  {id:6,label:'P1',seats:6,x:80,y:60,w:150,h:84,shape:'sq',area:'Patio',occupied:false},
  {id:7,label:'P2',seats:4,x:300,y:70,w:84,h:84,shape:'sq',area:'Patio',occupied:true},
];
let nextId = 8;
let area = document.getElementById('area').value;

function render(){
  floor.className = designing ? 'designing' : '';
  floor.innerHTML = '';
  tables.filter(t=>t.area===area).forEach(t=>{
    const el = document.createElement('div');
    const occ = t.occupied;
    const border = occ ? '#D97706' : '#10B981';
    const bg = occ ? '#FFF7ED' : '#ECFDF5';
    el.className = `tbl ${t.shape==='rd'?'rd':'sq'}`;
    el.style.cssText += `left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;border-color:${border};background:${bg}`;
    el.innerHTML = `<div class="font-extrabold text-[14px]" style="color:#1A1815">${t.label}</div>
      <div class="text-[10px] text-stone-400">${t.seats} seats</div>
      ${(!designing&&occ)?'<div class="mono text-[11px] font-bold" style="color:#D97706">₹1,240</div>':''}`;
    el.dataset.id = t.id;
    if(designing) makeDraggable(el,t);
    floor.appendChild(el);
  });
}

function makeDraggable(el,t){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const r=floor.getBoundingClientRect();
    const ox=e.clientX-(r.left+t.x), oy=e.clientY-(r.top+t.y);
    const move=ev=>{
      t.x=Math.max(0,Math.min(r.width-t.w, ev.clientX-r.left-ox));
      t.y=Math.max(0,Math.min(r.height-t.h, ev.clientY-r.top-oy));
      // snap to 14px grid
      t.x=Math.round(t.x/14)*14; t.y=Math.round(t.y/14)*14;
      el.style.left=t.x+'px'; el.style.top=t.y+'px';
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
  el.addEventListener('dblclick',()=>{
    const s=prompt('Seats',t.seats); if(s)t.seats=+s||t.seats;
    const l=prompt('Label',t.label); if(l)t.label=l;
    render();
  });
}

document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const shape=b.dataset.add;
  tables.push({id:nextId++,label:'T'+nextId,seats:shape==='rd'?2:4,x:28,y:28,
    w:shape==='rd'?64:84,h:shape==='rd'?64:84,shape,area,occupied:false});
  render();
});
document.getElementById('area').onchange=e=>{area=e.target.value;render();};

function setMode(d){
  designing=d;
  document.getElementById('mDesign').className=`px-4 py-1.5 rounded-lg text-[12px] font-bold ${d?'bg-white shadow-sm':'text-stone-500'}`;
  document.getElementById('mService').className=`px-4 py-1.5 rounded-lg text-[12px] font-bold ${!d?'bg-white shadow-sm':'text-stone-500'}`;
  document.getElementById('toolbar').style.display=d?'flex':'none';
  render();
}
document.getElementById('mDesign').onclick=()=>setMode(true);
document.getElementById('mService').onclick=()=>setMode(false);
render();
</script>
</body></html>
